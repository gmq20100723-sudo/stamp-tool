<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brandmark" aria-hidden="true">印</span><span data-i18n="brand">截图盖章</span></div>
      <nav class="lang" aria-label="Language">
        <button type="button" data-lang="zh" class="active" aria-pressed="true">中</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="ko" aria-pressed="false">한</button>
      </nav>
    </header>
    <section class="intro">
      <div><p class="eyebrow" data-i18n="eyebrow">LOCAL IMAGE TOOL</p><h1 data-i18n="title">给截图，盖个自己的章。</h1><p data-i18n="subtitle">选好图片，调整水印，保存就完成。简单，也安心。</p></div>
      <div class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 5 6v5c0 4.7 2.9 8.2 7 10 4.1-1.8 7-5.3 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg><span data-i18n="privacy">图片只在你的设备上处理</span></div>
    </section>
    <main class="workbench">
      <section class="panel preview-panel" aria-label="Preview">
        <div class="preview-top"><span class="preview-label" data-i18n="preview">实时预览</span><span class="image-count" id="imageCount"></span></div>
        <div class="canvas-wrap" id="dropZone">
          <canvas id="previewCanvas"></canvas>
          <div class="empty-state" id="emptyState"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></svg></div><strong data-i18n="emptyTitle">把图片放在这里</strong><span data-i18n="emptyHint">拖入一张或多张图片，或点击下方按钮选择</span></div>
        </div>
        <div class="preview-bottom"><span class="file-name" id="activeName" data-i18n="noImage">还没有图片</span><div class="thumbs" id="thumbs"></div></div>
      </section>
      <aside class="panel controls">
        <div class="control-head"><div><h2 data-i18n="settings">水印设置</h2><p data-i18n="settingsHint">效果会同步显示在预览中</p></div></div>
        <div class="text-field"><label for="watermark" data-i18n="watermarkLabel">水印文字</label><input id="watermark" class="text-input" type="text" maxlength="80" value="@gb9886" autocomplete="off" spellcheck="false"></div>
        <div><div class="slider-head"><label for="size" data-i18n="sizeLabel">字号</label><span class="slider-value" id="sizeValue">4 / 10</span></div><input id="size" class="slider" type="range" min="1" max="10" step="1" value="4"><div class="slider-notes"><span data-i18n="small">小</span><span data-i18n="large">大</span></div></div>
        <div><div class="slider-head"><label for="opacity" data-i18n="opacityLabel">透明度</label><span class="slider-value" id="opacityValue">72%</span></div><input id="opacity" class="slider" type="range" min="10" max="100" step="1" value="72"><div class="slider-notes"><span data-i18n="seeThrough">轻一点</span><span data-i18n="solid">更清晰</span></div></div>
        <div><span class="field-title" data-i18n="positionLabel">位置</span><div class="position-grid" id="positions">
          <button type="button" data-position="tl" aria-label="Top left" title="Top left" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M6 7h6M6 7v5"/></svg></button>
          <button type="button" data-position="tr" aria-label="Top right" title="Top right" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M18 7h-6m6 0v5"/></svg></button>
          <button type="button" data-position="center" aria-label="Center" title="Center" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M8 12h8m-4-4v8"/></svg></button>
          <button type="button" data-position="bl" aria-label="Bottom left" title="Bottom left" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M6 17h6m-6 0v-5"/></svg></button>
          <button type="button" data-position="br" aria-label="Bottom right" title="Bottom right" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M18 17h-6m6 0v-5"/></svg></button>
        </div></div>
        <div><span class="field-title" data-i18n="colorLabel">颜色</span><div class="segmented" id="colorModes"><button type="button" data-color="#ffffff" aria-pressed="true" data-i18n="white">白色</button><button type="button" data-color="#171916" aria-pressed="false" data-i18n="black">黑色</button><button type="button" data-color="#F5BE6E" aria-pressed="false" data-i18n="amber">琥珀</button></div></div>
        <div class="actions"><button class="primary" id="downloadBtn" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3"/></svg><span id="downloadText" data-i18n="download">下载加好水印的图片</span></button><button class="secondary" id="chooseBtn" type="button" data-i18n="choose">选择图片</button><input id="fileInput" type="file" accept="image/*" multiple hidden></div>
        <p class="footnote" data-i18n="footnote">支持 PNG、JPG、WebP · 多张图片会打包成 ZIP</p><div class="status" id="status" role="status" aria-live="polite"></div>
      </aside>
    </main>
  </div>
  <div class="drop-overlay" id="dropOverlay" data-i18n="dropOverlay">松开即可添加图片</div>
  <script>
  (()=>{

      en:{brand:'Screenshot Stamp',eyebrow:'LOCAL IMAGE TOOL',title:'Put your mark on it.',subtitle:'Choose your images, tune the watermark, and save. Simple and private.',privacy:'Images stay on your device',preview:'Live preview',emptyTitle:'Drop images here',emptyHint:'Drag in one or more images, or choose them below',noImage:'No image selected',settings:'Watermark settings',settingsHint:'Changes appear in the preview',watermarkLabel:'Watermark text',sizeLabel:'Size',small:'Small',large:'Large',opacityLabel:'Opacity',seeThrough:'Subtle',solid:'Solid',positionLabel:'Position',white:'White',black:'Black',amber:'Amber',colorLabel:'Color',download:'Download watermarked image',downloadOne:'Download watermarked image',downloadMany:'Download all · ZIP',choose:'Choose images',footnote:'PNG, JPG, WebP supported · Multiple images download as a ZIP',dropOverlay:'Drop to add images',count:'images',processed:'Download complete',processing:'Processing images…',chooseFirst:'Choose images first',unsupported:'Could not read this image',downloadError:'Download failed. Please try again.',emptyText:'Watermark text cannot be empty',remove:'Remove image'},
      ko:{brand:'스크린샷 도장',eyebrow:'LOCAL IMAGE TOOL',title:'스크린샷에 나만의 표시를.',subtitle:'이미지를 고르고 워터마크를 조정한 뒤 저장하세요. 간단하고 안전해요.',privacy:'이미지는 기기 안에서만 처리돼요',preview:'실시간 미리보기',emptyTitle:'이미지를 여기에 놓으세요',emptyHint:'한 장 또는 여러 장을 끌어오거나 아래에서 선택하세요',noImage:'선택된 이미지 없음',settings:'워터마크 설정',settingsHint:'변경 사항이 미리보기에 반영돼요',watermarkLabel:'워터마크 텍스트',sizeLabel:'크기',small:'작게',large:'크게',opacityLabel:'불투명도',seeThrough:'은은하게',solid:'선명하게',positionLabel:'위치',white:'흰색',black:'검정',amber:'앰버',colorLabel:'색상',download:'워터마크 이미지 다운로드',downloadOne:'워터마크 이미지 다운로드',downloadMany:'전체 다운로드 · ZIP',choose:'이미지 선택',footnote:'PNG, JPG, WebP 지원 · 여러 장은 ZIP으로 다운로드',dropOverlay:'놓으면 이미지가 추가돼요',count:'장',processed:'다운로드 완료',processing:'이미지 처리 중…',chooseFirst:'먼저 이미지를 선택하세요',unsupported:'이미지를 읽을 수 없어요',downloadError:'다운로드 실패. 다시 시도하세요.',emptyText:'워터마크 텍스트를 입력하세요',remove:'이미지 삭제'}

    const state={images:[],active:0,lang:'zh',position:'br',color:'#ffffff',size:4,opacity:72};
    const t=k=>translations[state.lang][k]||translations.en[k]||k;
    function setLanguage(lang){state.lang=translations[lang]?lang:'zh';document.documentElement.lang=state.lang==='zh'?'zh-Hans':state.lang==='ko'?'ko':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;if(translations[state.lang][key])el.textContent=translations[state.lang][key]});document.querySelectorAll('[data-lang]').forEach(b=>{const active=b.dataset.lang===state.lang;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});updateUI()}

    function canvasBlob(canvas){return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Canvas export failed')),'image/png'))}
    const encoder=new TextEncoder();
    function crc32(bytes){let c=-1;for(let i=0;i<bytes.length;i++){c^=bytes[i];for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^-1)>>>0}
    function u16(n){return[n&255,(n>>>8)&255]}function u32(n){return[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
    function zipStore(files){const local=[],central=[];let offset=0;for(const f of files){const name=encoder.encode(f.name),data=f.data,crc=crc32(data),header=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name]);local.push(header,data);const c=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]);central.push(c);offset+=header.length+data.length}const centralSize=central.reduce((n,a)=>n+a.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centralSize),...u32(offset),...u16(0)]);return new Blob([...local,...central,end],{type:'application/zip'})}
    function safeName(name){const base=name.replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').trim().slice(0,100)||'image';return`${base}-stamped.png`}
    function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
    async function downloadAll(){if(!state.images.length)return;if(!els.text.value.trim()){els.status.textContent=t('emptyText');els.text.focus();return}els.download.disabled=true;els.status.textContent=t('processing');try{const output=[];for(const item of state.images){const canvas=document.createElement('canvas');drawWatermark(canvas,item.image);const blob=await canvasBlob(canvas);output.push({name:safeName(item.name),blob,data:new Uint8Array(await blob.arrayBuffer())});canvas.width=0;canvas.height=0}if(output.length===1)saveBlob(output[0].blob,output[0].name);else saveBlob(zipStore(output.map(x=>({name:x.name,data:x.data}))),`screenshot-stamp-${new Date().toISOString().slice(0,10)}.zip`);els.status.textContent=t('processed')}catch(err){els.status.textContent=t('downloadError');console.error(err)}finally{els.download.disabled=!state.images.length}}
    els.choose.addEventListener('click',()=>els.input.click());els.input.addEventListener('change',e=>addFiles(e.target.files));els.text.addEventListener('input',updateUI);els.size.addEventListener('input',()=>{state.size=Number(els.size.value);updateUI()});els.opacity.addEventListener('input',()=>{state.opacity=Number(els.opacity.value);updateUI()});document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));document.querySelectorAll('[data-position]').forEach(b=>b.addEventListener('click',()=>{state.position=b.dataset.position;document.querySelectorAll('[data-position]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));updateUI()}));document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{state.color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));updateUI()}));els.download.addEventListener('click',downloadAll);
    let dragDepth=0;window.addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();dragDepth++;els.overlay.classList.add('show')}});window.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault()});window.addEventListener('dragleave',e=>{if([...e.dataTransfer.types].includes('Files')){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)els.overlay.classList.remove('show')}});window.addEventListener('drop',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();dragDepth=0;els.overlay.classList.remove('show');addFiles(e.dataTransfer.files)}});
    setLanguage('zh');
  })();
  </script>
